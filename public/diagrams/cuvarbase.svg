<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340">
  <style>
    text { font-family: 'Palatino', 'Palatino Linotype', serif; fill: #111; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #555; }
    .title { font-size: 14px; font-weight: 600; }
    .accent { fill: #8b0000; }
    .accent-stroke { stroke: #8b0000; }
    .line-gray { stroke: #e0e0e0; stroke-width: 1; }
    .line-dark { stroke: #555; stroke-width: 1.5; fill: none; }
    .box { fill: none; stroke: #111; stroke-width: 1.5; rx: 4; }
    .box-fill { fill: #f8f8f2; stroke: #111; stroke-width: 1.5; rx: 4; }
  </style>

  <!-- Light Curve -->
  <rect x="30" y="50" width="120" height="60" class="box-fill"/>
  <text x="90" y="75" text-anchor="middle" class="sans title" font-size="13">Light Curve</text>
  <polyline points="45,95 55,88 65,100 75,85 85,98 95,82 105,96 115,87 125,93 135,89" class="line-dark"/>

  <!-- Arrow fan-out -->
  <line x1="150" y1="65" x2="220" y2="40" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="150" y1="75" x2="220" y2="75" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="150" y1="85" x2="220" y2="110" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- GPU Frequency Trials -->
  <rect x="225" y="20" width="130" height="35" class="box-fill"/>
  <text x="290" y="42" text-anchor="middle" class="sans" font-size="12">GPU Thread 1: f₁</text>

  <rect x="225" y="58" width="130" height="35" class="box-fill"/>
  <text x="290" y="80" text-anchor="middle" class="sans" font-size="12">GPU Thread 2: f₂</text>

  <rect x="225" y="96" width="130" height="35" class="box-fill"/>
  <text x="290" y="118" text-anchor="middle" class="sans" font-size="12">GPU Thread N: f_N</text>

  <text x="290" y="150" text-anchor="middle" class="sans label">N parallel frequency trials</text>

  <!-- Dots between threads -->
  <circle cx="260" cy="93" r="1" fill="#555"/>
  <circle cx="270" cy="93" r="1" fill="#555"/>
  <circle cx="280" cy="93" r="1" fill="#555"/>

  <!-- Arrow to periodogram -->
  <line x1="355" y1="40" x2="420" y2="75" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="355" y1="75" x2="420" y2="75" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="355" y1="110" x2="420" y2="75" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Periodogram -->
  <rect x="425" y="30" width="200" height="100" class="box-fill"/>
  <text x="525" y="50" text-anchor="middle" class="sans title" font-size="13">Periodogram</text>
  <!-- Periodogram bars -->
  <line x1="450" y1="115" x2="600" y2="115" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="455" y="95" width="8" height="20" fill="#555" opacity="0.4"/>
  <rect x="470" y="85" width="8" height="30" fill="#555" opacity="0.4"/>
  <rect x="485" y="90" width="8" height="25" fill="#555" opacity="0.4"/>
  <rect x="500" y="65" width="8" height="50" fill="#8b0000"/>
  <rect x="515" y="100" width="8" height="15" fill="#555" opacity="0.4"/>
  <rect x="530" y="92" width="8" height="23" fill="#555" opacity="0.4"/>
  <rect x="545" y="98" width="8" height="17" fill="#555" opacity="0.4"/>
  <rect x="560" y="88" width="8" height="27" fill="#555" opacity="0.4"/>
  <rect x="575" y="95" width="8" height="20" fill="#555" opacity="0.4"/>
  <text x="504" y="60" text-anchor="middle" class="sans accent" font-size="10" font-weight="600">peak</text>

  <!-- Comparison bars -->
  <text x="30" y="210" class="sans title" font-size="14">CPU Sequential</text>
  <rect x="30" y="220" width="480" height="28" rx="3" fill="#e0e0e0" stroke="#555" stroke-width="1"/>
  <text x="270" y="239" text-anchor="middle" class="sans" font-size="12" fill="#555">Process frequencies one at a time</text>

  <text x="30" y="280" class="sans title" font-size="14">GPU Parallel</text>
  <rect x="30" y="290" width="80" height="28" rx="3" fill="#8b0000" opacity="0.15" stroke="#8b0000" stroke-width="1.5"/>
  <text x="70" y="309" text-anchor="middle" class="sans accent" font-size="12" font-weight="600">100x+</text>

  <text x="130" y="309" class="sans label" font-size="12">faster</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>
</svg>
