<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320">
  <style>
    text { font-family: 'Palatino', 'Palatino Linotype', serif; fill: #111; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .label { font-size: 12px; fill: #555; }
    .title { font-size: 14px; font-weight: 600; }
    .box { fill: #f8f8f2; stroke: #111; stroke-width: 1.5; rx: 4; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Input labels -->
  <text x="120" y="30" text-anchor="middle" class="sans title" font-size="13">Input</text>

  <!-- Speech input -->
  <rect x="50" y="50" width="140" height="50" class="box"/>
  <text x="120" y="72" text-anchor="middle" class="sans" font-size="13" font-weight="600">Speech</text>
  <!-- Waveform icon -->
  <polyline points="65,87 73,82 81,90 89,78 97,86 105,80 113,88 121,83 129,87 137,82 145,87 153,84 161,87 169,82 177,87" fill="none" stroke="#555" stroke-width="1"/>

  <!-- Text input -->
  <rect x="50" y="120" width="140" height="50" class="box"/>
  <text x="120" y="142" text-anchor="middle" class="sans" font-size="13" font-weight="600">Text</text>
  <text x="120" y="160" text-anchor="middle" class="label">Abc...</text>

  <!-- Arrows from inputs to model -->
  <line x1="190" y1="75" x2="235" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="145" x2="235" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Central model -->
  <rect x="240" y="60" width="180" height="120" rx="8" fill="#f8f8f2" stroke="#111" stroke-width="2.5"/>
  <text x="330" y="110" text-anchor="middle" class="sans" font-size="20" font-weight="700">SeamlessM4T</text>
  <text x="330" y="135" text-anchor="middle" class="sans label" font-size="13">Unified Multimodal</text>
  <text x="330" y="152" text-anchor="middle" class="sans label" font-size="13">Translation</text>

  <!-- Output labels -->
  <text x="540" y="30" text-anchor="middle" class="sans title" font-size="13">Output</text>

  <!-- Speech output -->
  <rect x="470" y="50" width="140" height="50" class="box"/>
  <text x="540" y="72" text-anchor="middle" class="sans" font-size="13" font-weight="600">Speech</text>
  <polyline points="485,87 493,82 501,90 509,78 517,86 525,80 533,88 541,83 549,87 557,82 565,87 573,84 581,87 589,82 597,87" fill="none" stroke="#555" stroke-width="1"/>

  <!-- Text output -->
  <rect x="470" y="120" width="140" height="50" class="box"/>
  <text x="540" y="142" text-anchor="middle" class="sans" font-size="13" font-weight="600">Text</text>
  <text x="540" y="160" text-anchor="middle" class="label">Abc...</text>

  <!-- Arrows from model to outputs -->
  <line x1="420" y1="100" x2="465" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="130" x2="465" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Bottom labels -->
  <text x="330" y="240" text-anchor="middle" class="sans" font-size="16" font-weight="600">100+ languages</text>
  <text x="330" y="265" text-anchor="middle" class="sans label" font-size="13">First single model for all four translation modalities</text>
</svg>
