<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260">
  <style>
    text { font-family: 'Palatino', 'Palatino Linotype', serif; fill: #111; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .label { font-size: 12px; fill: #555; }
    .title { font-size: 14px; font-weight: 600; }
    .box { fill: #f8f8f2; stroke: #111; stroke-width: 1.5; rx: 4; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <text x="330" y="28" text-anchor="middle" class="sans title" font-size="15">Two-Stage Evaluation Protocol</text>

  <!-- Stage 1 -->
  <rect x="30" y="55" width="160" height="100" class="box"/>
  <text x="110" y="78" text-anchor="middle" class="sans title" font-size="13">Stage 1</text>
  <text x="110" y="98" text-anchor="middle" class="sans" font-size="12">Score Sample A</text>
  <!-- 1-5 scale dots -->
  <g transform="translate(50, 110)">
    <circle cx="0" cy="12" r="8" fill="none" stroke="#555" stroke-width="1.2"/>
    <text x="0" y="16" text-anchor="middle" class="sans" font-size="10">1</text>
    <circle cx="24" cy="12" r="8" fill="none" stroke="#555" stroke-width="1.2"/>
    <text x="24" y="16" text-anchor="middle" class="sans" font-size="10">2</text>
    <circle cx="48" cy="12" r="8" fill="none" stroke="#555" stroke-width="1.2"/>
    <text x="48" y="16" text-anchor="middle" class="sans" font-size="10">3</text>
    <circle cx="72" cy="12" r="8" fill="none" stroke="#555" stroke-width="1.2"/>
    <text x="72" y="16" text-anchor="middle" class="sans" font-size="10">4</text>
    <circle cx="96" cy="12" r="8" fill="#111" stroke="#111" stroke-width="1.2"/>
    <text x="96" y="16" text-anchor="middle" class="sans" font-size="10" fill="#f8f8f2">5</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="190" y1="105" x2="240" y2="105" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Stage 2 -->
  <rect x="245" y="55" width="160" height="100" class="box"/>
  <text x="325" y="78" text-anchor="middle" class="sans title" font-size="13">Stage 2</text>
  <text x="325" y="98" text-anchor="middle" class="sans" font-size="12">Score Sample B</text>
  <g transform="translate(265, 110)">
    <circle cx="0" cy="12" r="8" fill="none" stroke="#555" stroke-width="1.2"/>
    <text x="0" y="16" text-anchor="middle" class="sans" font-size="10">1</text>
    <circle cx="24" cy="12" r="8" fill="none" stroke="#555" stroke-width="1.2"/>
    <text x="24" y="16" text-anchor="middle" class="sans" font-size="10">2</text>
    <circle cx="48" cy="12" r="8" fill="#111" stroke="#111" stroke-width="1.2"/>
    <text x="48" y="16" text-anchor="middle" class="sans" font-size="10" fill="#f8f8f2">3</text>
    <circle cx="72" cy="12" r="8" fill="none" stroke="#555" stroke-width="1.2"/>
    <text x="72" y="16" text-anchor="middle" class="sans" font-size="10">4</text>
    <circle cx="96" cy="12" r="8" fill="none" stroke="#555" stroke-width="1.2"/>
    <text x="96" y="16" text-anchor="middle" class="sans" font-size="10">5</text>
  </g>

  <!-- Arrow 2->3 -->
  <line x1="405" y1="105" x2="455" y2="105" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Stage 3 -->
  <rect x="460" y="55" width="170" height="100" class="box"/>
  <text x="545" y="78" text-anchor="middle" class="sans title" font-size="13">Stage 3</text>
  <text x="545" y="98" text-anchor="middle" class="sans" font-size="12">A/B Preference</text>
  <g transform="translate(490, 110)">
    <rect x="0" y="2" width="40" height="24" rx="3" fill="#111"/>
    <text x="20" y="19" text-anchor="middle" class="sans" font-size="11" fill="#f8f8f2">A</text>
    <text x="55" y="19" text-anchor="middle" class="sans" font-size="12" fill="#555">or</text>
    <rect x="70" y="2" width="40" height="24" rx="3" fill="none" stroke="#555" stroke-width="1.2"/>
    <text x="90" y="19" text-anchor="middle" class="sans" font-size="11">B</text>
  </g>

  <!-- Annotation -->
  <text x="330" y="200" text-anchor="middle" class="sans" font-size="12" fill="#555" font-style="italic">Absolute scoring forces careful listening before comparative judgment.</text>
  <text x="330" y="220" text-anchor="middle" class="sans" font-size="12" fill="#555" font-style="italic">Better inter-annotator agreement than direct CMOS-style comparison.</text>
</svg>
