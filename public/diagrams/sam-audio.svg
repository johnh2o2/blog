<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280">
  <style>
    text { font-family: 'Palatino', 'Palatino Linotype', serif; fill: #111; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .label { font-size: 12px; fill: #555; }
    .title { font-size: 14px; font-weight: 600; }
    .box { fill: #f8f8f2; stroke: #111; stroke-width: 1.5; rx: 4; }
    .accent { fill: #8b0000; }
    .accent-stroke { stroke: #8b0000; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <text x="330" y="25" text-anchor="middle" class="sans title" font-size="15">Three Prompting Modalities</text>

  <!-- Text prompt -->
  <rect x="30" y="50" width="150" height="40" class="box"/>
  <text x="55" y="66" class="sans" font-size="11" font-weight="600">Text</text>
  <text x="55" y="80" class="label">"isolate the piano"</text>

  <!-- Image prompt -->
  <rect x="30" y="105" width="150" height="45" class="box"/>
  <text x="55" y="121" class="sans" font-size="11" font-weight="600">Image</text>
  <!-- Image frame icon -->
  <rect x="130" y="112" width="36" height="28" rx="2" fill="none" stroke="#555" stroke-width="1"/>
  <circle cx="140" cy="123" r="4" fill="#e0e0e0"/>
  <polygon points="132,136 148,126 158,136" fill="#e0e0e0"/>

  <!-- Audio/time-span prompt -->
  <rect x="30" y="165" width="150" height="50" class="box"/>
  <text x="55" y="181" class="sans" font-size="11" font-weight="600">Time-span</text>
  <!-- Waveform with highlighted segment -->
  <polyline points="45,200 52,194 59,206 66,192 73,204 80,195 87,202 94,197 101,205 108,198 115,200 122,193 129,201 136,196 143,200 150,194 157,200 164,197" fill="none" stroke="#555" stroke-width="1"/>
  <!-- Highlight span -->
  <rect x="73" y="188" width="35" height="22" rx="2" fill="#8b0000" opacity="0.15" stroke="#8b0000" stroke-width="1"/>

  <!-- Arrows to model -->
  <line x1="180" y1="70" x2="250" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="180" y1="127" x2="250" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="180" y1="190" x2="250" y2="145" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- SAM Audio model -->
  <rect x="255" y="110" width="140" height="65" rx="6" fill="#f8f8f2" stroke="#111" stroke-width="2"/>
  <text x="325" y="140" text-anchor="middle" class="sans" font-size="16" font-weight="700">SAM Audio</text>
  <text x="325" y="160" text-anchor="middle" class="label">Unified separation</text>

  <!-- Arrow to output -->
  <line x1="395" y1="142" x2="445" y2="142" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Output: separated waveform -->
  <rect x="450" y="90" width="180" height="105" class="box"/>
  <text x="540" y="112" text-anchor="middle" class="sans" font-size="12" font-weight="600">Separated Audio</text>

  <!-- Faded original waveform -->
  <polyline points="470,155 478,148 486,160 494,145 502,157 510,150 518,155 526,149 534,158 542,152 550,155 558,148 566,156 574,151 582,155 590,149 598,155 606,152" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Clean separated waveform on top -->
  <polyline points="470,150 478,143 486,155 494,140 502,152 510,145 518,150" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Gap then faded -->
  <polyline points="518,150 526,149 534,150 542,150 550,150 558,150 566,150 574,150 582,150 590,150 598,150 606,150" fill="none" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>

  <text x="540" y="180" text-anchor="middle" class="label" font-style="italic">target isolated from mixture</text>

  <!-- Bottom caption -->
  <text x="330" y="250" text-anchor="middle" class="sans label" font-size="13">Speech, music, and general sounds — one unified architecture</text>
</svg>
