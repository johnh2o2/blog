<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280">
  <style>
    text { font-family: 'Palatino', 'Palatino Linotype', serif; fill: #111; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .label { font-size: 12px; fill: #555; }
    .title { font-size: 14px; font-weight: 600; }
    .box { fill: #f8f8f2; stroke: #111; stroke-width: 1.5; rx: 4; }
    .accent { fill: #8b0000; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#8b0000"/>
    </marker>
  </defs>

  <!-- Text Prompt -->
  <rect x="30" y="90" width="120" height="55" class="box"/>
  <text x="90" y="115" text-anchor="middle" class="sans title" font-size="13">Text Prompt</text>
  <text x="90" y="132" text-anchor="middle" class="label">"A cat playing piano..."</text>

  <!-- Arrow -->
  <line x1="150" y1="117" x2="195" y2="117" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Movie Gen -->
  <rect x="200" y="75" width="130" height="85" class="box"/>
  <text x="265" y="108" text-anchor="middle" class="sans title" font-size="16">Movie Gen</text>
  <text x="265" y="126" text-anchor="middle" class="label">Foundation Models</text>
  <text x="265" y="145" text-anchor="middle" class="label">88 authors</text>

  <!-- Arrows to outputs -->
  <line x1="330" y1="95" x2="380" y2="55" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="330" y1="117" x2="380" y2="117" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="330" y1="140" x2="380" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Video output -->
  <rect x="385" y="30" width="120" height="50" class="box"/>
  <text x="445" y="52" text-anchor="middle" class="sans" font-size="12" font-weight="600">Video</text>
  <!-- Film strip -->
  <g transform="translate(400, 58)">
    <rect x="0" y="0" width="14" height="10" fill="#e0e0e0" stroke="#555" stroke-width="0.5"/>
    <rect x="18" y="0" width="14" height="10" fill="#e0e0e0" stroke="#555" stroke-width="0.5"/>
    <rect x="36" y="0" width="14" height="10" fill="#e0e0e0" stroke="#555" stroke-width="0.5"/>
    <rect x="54" y="0" width="14" height="10" fill="#e0e0e0" stroke="#555" stroke-width="0.5"/>
    <rect x="72" y="0" width="14" height="10" fill="#e0e0e0" stroke="#555" stroke-width="0.5"/>
  </g>

  <!-- Audio output -->
  <rect x="385" y="92" width="120" height="50" class="box"/>
  <text x="445" y="114" text-anchor="middle" class="sans" font-size="12" font-weight="600">Audio</text>
  <!-- Waveform -->
  <polyline points="400,130 408,125 416,135 424,120 432,132 440,122 448,130 456,126 464,133 472,128 480,130 488,125 496,130" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- Image output -->
  <rect x="385" y="155" width="120" height="50" class="box"/>
  <text x="445" y="177" text-anchor="middle" class="sans" font-size="12" font-weight="600">Image</text>
  <rect x="420" y="182" width="50" height="15" fill="#e0e0e0" stroke="#555" stroke-width="0.5" rx="2"/>

  <!-- Arrow from Audio only to evaluation -->
  <line x1="505" y1="117" x2="535" y2="117" stroke="#8b0000" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- Audio Evaluation -->
  <rect x="540" y="90" width="100" height="55" rx="4" fill="none" stroke="#8b0000" stroke-width="2"/>
  <text x="590" y="114" text-anchor="middle" class="sans accent" font-size="12" font-weight="600">Audio</text>
  <text x="590" y="130" text-anchor="middle" class="sans accent" font-size="12" font-weight="600">Evaluation</text>

  <!-- Bottom note -->
  <text x="330" y="250" text-anchor="middle" class="sans label" font-size="13">448 citations · 1,100+ HN points · deployed across Meta ecosystem</text>
</svg>
