<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280">
  <style>
    text { font-family: 'Palatino', 'Palatino Linotype', serif; fill: #111; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .label { font-size: 12px; fill: #555; }
    .title { font-size: 14px; font-weight: 600; }
    .box { fill: #f8f8f2; stroke: #111; stroke-width: 1.5; rx: 4; }
    .accent { fill: #8b0000; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- GPU Cluster -->
  <text x="80" y="42" text-anchor="middle" class="sans title" font-size="13">GPU Cluster</text>

  <!-- Grid of GPU nodes: 6x4 -->
  <!-- Row 1 -->
  <rect x="20" y="52" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="44" y="52" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="68" y="52" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="92" y="52" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="116" y="52" width="20" height="20" rx="2" fill="#8b0000" opacity="0.2" stroke="#8b0000" stroke-width="1"/>
  <rect x="140" y="52" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <!-- Row 2 -->
  <rect x="20" y="76" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="44" y="76" width="20" height="20" rx="2" fill="#8b0000" opacity="0.2" stroke="#8b0000" stroke-width="1"/>
  <rect x="68" y="76" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="92" y="76" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="116" y="76" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="140" y="76" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <!-- Row 3 -->
  <rect x="20" y="100" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="44" y="100" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="68" y="100" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="92" y="100" width="20" height="20" rx="2" fill="#8b0000" opacity="0.2" stroke="#8b0000" stroke-width="1"/>
  <rect x="116" y="100" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="140" y="100" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <!-- Row 4 -->
  <rect x="20" y="124" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="44" y="124" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="68" y="124" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="92" y="124" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="116" y="124" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="140" y="124" width="20" height="20" rx="2" fill="#8b0000" opacity="0.2" stroke="#8b0000" stroke-width="1"/>
  <!-- Row 5 -->
  <rect x="20" y="148" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="44" y="148" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="68" y="148" width="20" height="20" rx="2" fill="#8b0000" opacity="0.2" stroke="#8b0000" stroke-width="1"/>
  <rect x="92" y="148" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="116" y="148" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>
  <rect x="140" y="148" width="20" height="20" rx="2" fill="#f8f8f2" stroke="#111" stroke-width="1"/>

  <!-- Small "x" marks on failed nodes -->
  <text x="126" y="68" text-anchor="middle" class="sans accent" font-size="14" font-weight="700">×</text>
  <text x="54" y="92" text-anchor="middle" class="sans accent" font-size="14" font-weight="700">×</text>
  <text x="102" y="116" text-anchor="middle" class="sans accent" font-size="14" font-weight="700">×</text>
  <text x="150" y="140" text-anchor="middle" class="sans accent" font-size="14" font-weight="700">×</text>
  <text x="78" y="164" text-anchor="middle" class="sans accent" font-size="14" font-weight="700">×</text>

  <!-- Stats under cluster -->
  <text x="80" y="190" text-anchor="middle" class="sans label" font-size="10">4M+ jobs · 150M+ GPU-hrs</text>

  <!-- Arrow to analysis -->
  <line x1="170" y1="115" x2="220" y2="115" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Failure Analysis box -->
  <rect x="225" y="70" width="140" height="90" rx="6" fill="#f8f8f2" stroke="#111" stroke-width="2"/>
  <text x="295" y="98" text-anchor="middle" class="sans" font-size="15" font-weight="700">Failure</text>
  <text x="295" y="118" text-anchor="middle" class="sans" font-size="15" font-weight="700">Analysis</text>
  <text x="295" y="145" text-anchor="middle" class="label">Taxonomy &amp; modeling</text>

  <!-- Arrow to MTTF chart -->
  <line x1="365" y1="100" x2="415" y2="70" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Arrow to mitigation -->
  <line x1="365" y1="130" x2="415" y2="160" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- MTTF Projection box -->
  <rect x="420" y="35" width="210" height="80" class="box"/>
  <text x="525" y="56" text-anchor="middle" class="sans title" font-size="12">MTTF Projection</text>

  <!-- Mini chart: MTTF curve declining with GPU count -->
  <!-- Axes -->
  <line x1="445" y1="100" x2="445" y2="65" stroke="#555" stroke-width="1"/>
  <line x1="445" y1="100" x2="610" y2="100" stroke="#555" stroke-width="1"/>
  <!-- Axis labels -->
  <text x="440" y="72" text-anchor="end" class="sans" font-size="8" fill="#555">MTTF</text>
  <text x="610" y="98" text-anchor="end" class="sans" font-size="8" fill="#555">GPUs</text>
  <!-- Declining curve -->
  <path d="M450,68 Q480,70 500,80 Q520,90 550,95 Q580,98 605,99" fill="none" stroke="#8b0000" stroke-width="1.8"/>

  <!-- Mitigation Metrics box -->
  <rect x="420" y="130" width="210" height="80" class="box"/>
  <text x="525" y="152" text-anchor="middle" class="sans title" font-size="12">Mitigation Metrics</text>
  <!-- Mini bar chart -->
  <rect x="455" y="186" width="30" height="14" rx="2" fill="#e0e0e0" stroke="#555" stroke-width="0.5"/>
  <rect x="455" y="168" width="30" height="32" rx="2" fill="none" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
  <rect x="500" y="178" width="30" height="22" rx="2" fill="#e0e0e0" stroke="#555" stroke-width="0.5"/>
  <rect x="500" y="168" width="30" height="32" rx="2" fill="none" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
  <rect x="545" y="172" width="30" height="28" rx="2" fill="#e0e0e0" stroke="#555" stroke-width="0.5"/>
  <rect x="545" y="168" width="30" height="32" rx="2" fill="none" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
  <rect x="590" y="182" width="30" height="18" rx="2" fill="#e0e0e0" stroke="#555" stroke-width="0.5"/>
  <rect x="590" y="168" width="30" height="32" rx="2" fill="none" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Bottom caption -->
  <text x="330" y="250" text-anchor="middle" class="sans label" font-size="13">Reliability-aware infrastructure for large-scale ML training — HPCA 2025</text>
</svg>
