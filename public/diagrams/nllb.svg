<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380">
  <style>
    text { font-family: 'Palatino', 'Palatino Linotype', serif; fill: #111; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .label { font-size: 12px; fill: #555; }
    .lang { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #555; }
    .lang-hi { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #111; font-weight: 600; }
  </style>

  <!-- Central box -->
  <rect x="245" y="140" width="170" height="70" rx="6" fill="#f8f8f2" stroke="#111" stroke-width="2"/>
  <text x="330" y="172" text-anchor="middle" class="sans" font-size="20" font-weight="700">NLLB-200</text>
  <text x="330" y="195" text-anchor="middle" class="sans label" font-size="12">Single Multilingual Model</text>

  <!-- Language circles arranged around center -->
  <!-- Top row -->
  <circle cx="180" cy="60" r="22" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="180" y="64" text-anchor="middle" class="lang-hi">en</text>

  <circle cx="270" cy="45" r="22" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="270" y="49" text-anchor="middle" class="lang-hi">zh</text>

  <circle cx="390" cy="45" r="22" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="390" y="49" text-anchor="middle" class="lang-hi">fr</text>

  <circle cx="480" cy="60" r="22" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="480" y="64" text-anchor="middle" class="lang-hi">ar</text>

  <!-- Upper-middle -->
  <circle cx="120" cy="130" r="22" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="120" y="134" text-anchor="middle" class="lang">hi</text>

  <circle cx="540" cy="130" r="22" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="540" y="134" text-anchor="middle" class="lang">bn</text>

  <!-- Middle sides -->
  <circle cx="80" cy="200" r="22" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="80" y="204" text-anchor="middle" class="lang">sw</text>

  <circle cx="580" cy="200" r="22" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="580" y="204" text-anchor="middle" class="lang">yo</text>

  <!-- Lower-middle -->
  <circle cx="120" cy="270" r="22" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="120" y="274" text-anchor="middle" class="lang">ig</text>

  <circle cx="540" cy="270" r="22" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="540" y="274" text-anchor="middle" class="lang">am</text>

  <!-- Bottom row -->
  <circle cx="200" cy="320" r="22" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="200" y="324" text-anchor="middle" class="lang">qu</text>

  <circle cx="300" cy="340" r="22" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="300" y="344" text-anchor="middle" class="lang">ber</text>

  <circle cx="370" cy="340" r="22" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="370" y="344" text-anchor="middle" class="lang">luo</text>

  <circle cx="460" cy="320" r="22" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="460" y="324" text-anchor="middle" class="lang">ilo</text>

  <!-- Lines from languages to center -->
  <line x1="180" y1="82" x2="270" y2="140" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="270" y1="67" x2="290" y2="140" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="390" y1="67" x2="370" y2="140" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="480" y1="82" x2="390" y2="140" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="120" y1="152" x2="245" y2="170" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="540" y1="152" x2="415" y2="170" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="102" y1="200" x2="245" y2="180" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="558" y1="200" x2="415" y2="180" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="120" y1="248" x2="260" y2="210" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="540" y1="248" x2="400" y2="210" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="200" y1="298" x2="280" y2="210" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="300" y1="318" x2="310" y2="210" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="370" y1="318" x2="350" y2="210" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="460" y1="298" x2="380" y2="210" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Bottom label -->
  <text x="330" y="375" text-anchor="middle" class="sans" font-size="14" font-weight="600">200 languages, 40,000+ directions</text>
</svg>
